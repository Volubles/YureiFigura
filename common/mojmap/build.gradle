evaluationDependsOn(':common')

tasks.named('jar', Jar) {
    def commonJar = project(':common').tasks.named('jar', Jar)
    dependsOn commonJar
    from(commonJar.flatMap { it.archiveFile }.map { zipTree(it) })
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('sourcesJar', Jar) {
    def commonSources = project(':common').tasks.named('sourcesJar', Jar)
    dependsOn commonSources
    from(commonSources.flatMap { it.archiveFile }.map { zipTree(it) })
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = "${project.base.archivesName.get()}-common-mojmap"
            version = project.version
            artifact(tasks.named('jar'))
            artifact(tasks.named('sourcesJar'))
        }
    }
    setupRepositories(repositories)
}

void setupRepositories(RepositoryHandler repositories) {
    if (project.hasProperty("mavenUrl")) {
        repositories.maven {
            name = "figuraMaven"
            url = project.mavenUrl
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}
